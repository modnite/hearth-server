# The Hearth server, as one stack. This file is all there is to deploy: no .env, no other files.
#
#   docker compose up -d                  # the server, and LiveKit for voice and video
#   open http://localhost:8080/admin      # make the first administrator
#
# What it does by itself: an init step makes LiveKit's key and configuration (it finds this machine's public address), the server makes its
# own session secret, and clients are told where to reach calls from the address they connected by. Everything lives in the volumes.
#
# Optional, in the shell or a .env:  HEARTH_PORT, PUBLIC_IP, HEARTH_DOMAIN (for the "tls" profile), HEARTH_IMAGE, LIVEKIT_TAG.
#   docker compose --profile tls up -d  # also HTTPS for HEARTH_DOMAIN (Caddy fetches the certificate)
#   docker compose up -d hearth          # no voice and video (and on Docker Desktop, which has no host networking)
name: hearth

x-common: &common
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # Runs once, then exits: prepares the shared volume for the others.
  init:
    image: ${HEARTH_IMAGE:-ghcr.io/modnite/hearth-server:latest}
    build: { context: ., dockerfile: Dockerfile }
    command: ["node", "scripts/init-stack.mjs"]
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-}
    volumes:
      - hearth_shared:/shared
    restart: "no"
    security_opt: [no-new-privileges:true]
    user: "0:0"

  hearth:
    <<: *common
    image: ${HEARTH_IMAGE:-ghcr.io/modnite/hearth-server:latest}
    build: { context: ., dockerfile: Dockerfile }
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATA_DIR: /data
      HEARTH_SUPERVISED: "1"
      HEARTH_DOMAIN: ${HEARTH_DOMAIN:-localhost}
      LIVEKIT_INTERNAL_URL: http://host.docker.internal:7880
    volumes:
      - hearth_data:/data
      - hearth_shared:/shared:ro
    ports:
      - "${HEARTH_BIND:-0.0.0.0}:${HEARTH_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      init: { condition: service_completed_successfully }

  # Voice and video. Host networking so it can use the media ports (Linux only). Forward 7881/tcp and 50100-50199/udp on your router.
  livekit:
    <<: *common
    image: livekit/livekit-server:${LIVEKIT_TAG:-v1.13.11}
    command: ["--config", "/shared/livekit.yaml"]
    network_mode: host
    volumes:
      - hearth_shared:/shared:ro
    depends_on:
      init: { condition: service_completed_successfully }

  # HTTPS for HEARTH_DOMAIN. Camera and microphone in a browser need it; native apps do not.
  caddy:
    <<: *common
    profiles: ["tls"]
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      HEARTH_DOMAIN: ${HEARTH_DOMAIN:-localhost}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - hearth

configs:
  caddyfile:
    content: |
      {$$HEARTH_DOMAIN} {
        encode zstd gzip
        @livekit path /rtc /rtc/*
        reverse_proxy @livekit host.docker.internal:7880
        reverse_proxy hearth:8080
      }

volumes:
  hearth_data:
  hearth_shared:
  caddy_data:
  caddy_config:
