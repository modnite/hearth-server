# Hearth server. One command for the server, optional profiles for calls and HTTPS.
#
#   sh scripts/setup.sh                      # writes .env with fresh random secrets
#   docker compose up -d                     # the server on http://localhost:8080 (open /admin to set it up)
#   docker compose --profile calls up -d     # also run LiveKit for voice and video
#   docker compose --profile tls up -d       # also run Caddy for HTTPS on your own domain
#
# Everything the server keeps (accounts, messages, files, backups, panel settings) is in the "hearth_data" volume.
name: hearth

x-common: &common
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  hearth:
    <<: *common
    image: ${HEARTH_IMAGE:-hearth-server:latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATA_DIR: /data
      # The panel's "Restart server" button works because Docker restarts a container that exits.
      HEARTH_SUPERVISED: "1"
      HEARTH_DOMAIN: ${HEARTH_DOMAIN:-localhost}
      SESSION_SECRET: ${SESSION_SECRET:?Run sh scripts/setup.sh first, or set SESSION_SECRET in .env}
      # Calls (only used with the "calls" profile or your own LiveKit)
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_INTERNAL_URL: ${LIVEKIT_INTERNAL_URL:-http://host.docker.internal:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-hearth}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      # Optional
      HEARTH_NAME: ${HEARTH_NAME:-}
      REGISTRATION: ${REGISTRATION:-invite}
      REGISTRATION_KEY: ${REGISTRATION_KEY:-}
      BACKUP_QUOTA_MB: ${BACKUP_QUOTA_MB:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      FIRST_USER_USERNAME: ${FIRST_USER_USERNAME:-}
      FIRST_USER_PASSWORD: ${FIRST_USER_PASSWORD:-}
    volumes:
      - hearth_data:/data
    ports:
      - "${HEARTH_BIND:-0.0.0.0}:${HEARTH_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Voice and video. LiveKit runs on the host network so it can use the UDP range below.
  # Forward on your router:  7881/tcp  and  ${LIVEKIT_UDP_RANGE_START}-${LIVEKIT_UDP_RANGE_END}/udp
  # Render its config first:  sh scripts/render-livekit.sh
  livekit:
    <<: *common
    profiles: ["calls"]
    image: livekit/livekit-server:${LIVEKIT_TAG:-v1.9.0}
    command: ["--config", "/etc/livekit.yaml"]
    network_mode: host
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro

  # HTTPS for your own domain (needs HEARTH_DOMAIN to point at this machine and ports 80 and 443 open).
  caddy:
    <<: *common
    profiles: ["tls"]
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      HEARTH_DOMAIN: ${HEARTH_DOMAIN:?Set HEARTH_DOMAIN in .env for the tls profile}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - hearth

volumes:
  hearth_data:
  caddy_data:
  caddy_config:
