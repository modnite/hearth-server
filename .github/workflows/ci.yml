name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end check against a fresh server
        run: |
          DATA_DIR="$(mktemp -d)" PORT=18400 SESSION_SECRET=ci-session-secret-0123456789abcdef node dist/index.js &
          for i in $(seq 1 30); do curl -fs localhost:18400/api/health >/dev/null && break; sleep 1; done
          node scripts/smoke.mjs http://localhost:18400

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t hearth-server:ci .
      - name: Run it from the image on an empty volume and check it end to end
        run: |
          docker run -d --name hearth -p 8080:8080 -e SESSION_SECRET=ci-session-secret-0123456789abcdef -v hearth-ci-data:/data hearth-server:ci
          for i in $(seq 1 40); do curl -fs localhost:8080/api/health >/dev/null && break; sleep 1; done
          docker ps --format '{{.Names}} {{.Status}}'
          node server/scripts/smoke.mjs http://localhost:8080
      - name: The data survives a restart
        run: |
          docker restart hearth
          for i in $(seq 1 40); do curl -fs localhost:8080/api/health >/dev/null && break; sleep 1; done
          test "$(curl -s localhost:8080/api/server/info | python3 -c 'import json,sys; print(json.load(sys.stdin)["setupNeeded"])')" = "False"
          test "$(curl -s localhost:8080/api/server/info | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')" = "Smoke Test"
      - name: Show logs on failure
        if: failure()
        run: docker logs hearth
      - name: Log in to the registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish the image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker tag hearth-server:ci "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          docker tag hearth-server:ci "ghcr.io/${GITHUB_REPOSITORY}:latest"
          docker push "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          docker push "ghcr.io/${GITHUB_REPOSITORY}:latest"
