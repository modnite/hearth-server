name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end check against a fresh server
        run: |
          DATA_DIR="$(mktemp -d)" PORT=18400 SESSION_SECRET=ci-session-secret-0123456789abcdef node dist/index.js &
          for i in $(seq 1 30); do curl -fs localhost:18400/api/health >/dev/null && break; sleep 1; done
          node scripts/smoke.mjs http://localhost:18400

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t hearth-server:ci .
      - name: Start the whole stack from compose.yml alone
        run: |
          mkdir stack && cp compose.yml stack/ && cd stack
          HEARTH_IMAGE=hearth-server:ci HEARTH_PORT=8080 docker compose up -d
          for i in $(seq 1 60); do curl -fs localhost:8080/api/health >/dev/null && break; sleep 1; done
          sleep 5
          docker ps -a --format '{{.Names}} {{.Status}}'
          test "$(docker inspect -f '{{.State.Running}}' hearth-livekit-1)" = "true"
      - name: End-to-end check of the stack
        run: node server/scripts/smoke.mjs http://localhost:8080
      - name: Calls are set up and reachable
        run: |
          cd stack
          curl -s -c jar -H 'content-type: application/json' -d '{"username":"root","password":"correct horse battery"}' localhost:8080/api/auth/login >/dev/null
          curl -s -b jar localhost:8080/api/admin/status | python3 -c 'import json,sys; c=json.load(sys.stdin)["calls"]; print(c); sys.exit(0 if c["configured"] and c["reachable"] else 1)'
      - name: The data survives a restart
        run: |
          cd stack && docker compose restart
          for i in $(seq 1 60); do curl -fs localhost:8080/api/health >/dev/null && break; sleep 1; done
          test "$(curl -s localhost:8080/api/server/info | python3 -c 'import json,sys; print(json.load(sys.stdin)["setupNeeded"])')" = "False"
      - name: Show logs on failure
        if: failure()
        run: cd stack && docker compose logs
      - name: Log in to the registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish the image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker tag hearth-server:ci "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          docker tag hearth-server:ci "ghcr.io/${GITHUB_REPOSITORY}:latest"
          docker push "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          docker push "ghcr.io/${GITHUB_REPOSITORY}:latest"
